[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphops-api"
version = "0.1.0"
description = "GraphOps investigation API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "falkordb>=1.0",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
graphops-api = "app.main:main"
graphops-seed = "app.graph.seed:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
